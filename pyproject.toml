[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "term-dates"
version = "0.1.0"
description = "Aggregate LEA term dates across England, with optional per-school PD-day polling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "term-dates contributors" }]
keywords = ["education", "schools", "england", "lea", "term-dates", "inset", "pd-days"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.8",
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13.7",
    "platformdirs>=4.2",
    "pypdf>=4.0",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
term-dates = "term_dates.cli:app"

[project.urls]
Repository = "https://github.com/unkokaeru/term-dates"
Issues = "https://github.com/unkokaeru/term-dates/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/term_dates"]

[tool.hatch.build.targets.sdist]
include = ["src/term_dates", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer idiomatically uses typer.Option / typer.Argument as parameter defaults.
"src/term_dates/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
